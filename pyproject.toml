[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlpulse"
version = "0.1.0"
description = "Drop-in N+1 SQL detector. Works with any Python SQL library — no ORM required."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bhupendra Tale", email = "bgurjar05.bg@gmail.com" }]
keywords = ["developer-tools", "debugging", "python", "performance", "sqlpulse"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [""]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage   = "https://github.com/bhupendra05/sqlpulse"
Repository = "https://github.com/bhupendra05/sqlpulse"

[tool.setuptools.packages.find]
include = ["sqlpulse*"]